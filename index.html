<!-- 중요: 기존 index.html 전체 삭제 후 아래 코드로 교체 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>탕정삼성어린이집 당직표 생성기</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fb}
.header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.logo{width:70px;height:70px;object-fit:contain}
h1{margin:0}
.box{background:#fff;padding:18px;margin-bottom:18px;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,textarea,button{padding:8px;margin:4px;border-radius:6px;border:1px solid #bbb}
button{background:#2f6fed;color:white;border:0;font-weight:bold;cursor:pointer}
button.red{background:#d9534f}
button.gray{background:#777}
button.green{background:#2f9e44}
textarea{width:100%;height:120px}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white}
th,td{border:1px solid #bbb;padding:6px;text-align:center;font-size:12px}
th{background:#e8eef9}
.group{background:#dbe6f7;font-weight:bold}
.hidden{display:none}
.warn{color:red;font-weight:bold}
.small{font-size:13px;color:#555}
  .slotHead{
font-size:11px;
line-height:1.25;
min-width:70px;
}

.holidayRow td{
background:#bfbfbf !important;
font-weight:normal;
font-size:12px;
height:28px;
}

.weekGap td{
background:#d9d9d9 !important;
height:1px;
padding:0;
border:0;
}
#scheduleTable{
font-size:12px;
}

#scheduleTable th{
background:#e6edf7;
}

#scheduleTable td{
height:28px;
}
</style>
</head>
<body>

<div class="header">
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<div>
<h1>탕정삼성어린이집 당직표 생성기</h1>
<div>문의사항: 김혜인 교사</div>
</div>
</div>

<div class="box">
<h2>1. 월 선택</h2>
<input type="month" id="monthInput">
<button onclick="generateSchedule()">당직표 생성</button>
<button class="green" onclick="saveCurrentSchedule()">당직표 저장</button>
</div>

<div class="box">
<h2>2. 교사명단</h2>
<button class="gray" onclick="toggleTeacherBox()">교사명단 열기/닫기</button>
<button onclick="saveTeachers()">교사명단 저장</button>
<div id="teacherBox" class="hidden">
<textarea id="teacherInput"></textarea>
</div>
</div>

<div class="box">
<h2>3. 연차 입력</h2>
<input type="date" id="leaveDate">
<select id="leaveTeacher"></select>
<button onclick="addLeave()">연차 추가</button>
<button class="red" onclick="clearLeaves()">전체 삭제</button>
<div id="leaveList"></div>
</div>

<div class="box">
<h2>4. 공휴일 / 제외일 입력</h2>
<input type="date" id="holidayDate">
<input type="text" id="holidayReason" placeholder="사유 입력">
<button onclick="addHoliday()">추가</button>
<button class="red" onclick="clearHolidays()">전체 삭제</button>
<div id="holidayList"></div>
</div>

<div class="box">
<h2>당직표</h2>
<button onclick="downloadScheduleExcel()">엑셀 다운로드</button>
<div id="scheduleResult"></div>
</div>

<div class="box">
<h2>교사별 통계</h2>
<button onclick="downloadStatsExcel()">엑셀 다운로드</button>
<div id="statsResult"></div>
</div>

<script>
const DEFAULT_TEACHERS = `만1세, 햇빛반, 김교사
만1세, 달빛반, 이교사
만2세, 봄빛반, 박교사
만2세, 예빛반, 최교사
만3세, 새빛반, 정교사
만4세, 꽃빛반, 한교사
만4세, 윤빛반, 오교사
만5세, 솔빛반, 윤교사
만5세, 들빛반, 임교사`;

let leaves = JSON.parse(localStorage.getItem("leaves") || "[]");
let holidays = JSON.parse(localStorage.getItem("holidays") || "[]");
let currentSchedule = [];
let currentStats = [];

const slots = [
  {key:"m1", group:"영아", age:"만1세", room:"햇빛", time:"07:00~09:00<br>(2h)", role:"1층 시건", hours:2, part:"morning"},
  {key:"m2", group:"영아", age:"만1세", room:"햇빛", time:"07:30~09:00<br>(1.5h)", role:"놀이터 시건", hours:1.5, part:"morning"},

  {key:"m3", group:"영아", age:"만1세", room:"달빛", time:"08:00~09:00<br>(1h)", role:"", hours:1, part:"morning"},
  {key:"m4", group:"영아", age:"만1세", room:"달빛", time:"08:00~09:00<br>(1h)", role:"", hours:1, part:"morning"},
  {key:"m5", group:"영아", age:"만1세", room:"달빛", time:"08:30~17:30", role:"탄력", hours:0, part:"morning"},

  {key:"m6", group:"영아", age:"만2세", room:"봄빛", time:"07:00~09:00<br>(2h)", role:"오전책임교사", hours:2, part:"morning"},
  {key:"m7", group:"영아", age:"만2세", room:"봄빛", time:"07:30~09:00<br>(1.5h)", role:"", hours:1.5, part:"morning"},
  {key:"m8", group:"영아", age:"만2세", room:"봄빛", time:"08:30~17:30", role:"탄력", hours:0, part:"morning"},

  {key:"m9", group:"영아", age:"만2세", room:"예빛", time:"08:00~09:00<br>(1h)", role:"8:30까지 봄빛 보육 후 분반", hours:1, part:"morning"},

  {key:"m10", group:"유아", age:"만3세", room:"새빛", time:"07:00~09:00<br>(2h)", role:"2층 시건", hours:2, part:"morning"},
  {key:"m11", group:"유아", age:"만3세", room:"새빛", time:"08:00~09:00<br>(1h)", role:"", hours:1, part:"morning"},
  {key:"m12", group:"유아", age:"만3세", room:"새빛", time:"08:30~17:30", role:"탄력", hours:0, part:"morning"},

  {key:"m13", group:"유아", age:"만4세", room:"꽃빛", time:"07:30~09:00<br>(1.5h)", role:"", hours:1.5, part:"morning"},

  {key:"m14", group:"유아", age:"만4세", room:"윤빛", time:"07:30~09:00<br>(1.5h)", role:"놀이터<br>8:30까지 2세 봄빛 지원", hours:1.5, part:"morning"},

  {key:"m15", group:"유아", age:"만5세", room:"솔빛", time:"08:00~09:00<br>(1h)", role:"", hours:1, part:"morning"},

  {key:"m16", group:"유아", age:"만5세", room:"들빛", time:"08:30~17:30", role:"탄력", hours:0, part:"morning"},

  {key:"a1", group:"오후", age:"통합", room:"통합", time:"18:00~19:00<br>(1h)", role:"18:30부터 빨래정리<br>1·2층 전체 시건", hours:1, part:"afternoon"},

  {key:"a2", group:"오후", age:"통합", room:"통합", time:"18:00~20:00<br>(2h)", role:"오후책임교사", hours:2, part:"afternoon"}
];
window.onload = function(){
document.getElementById("teacherInput").value = localStorage.getItem("teachers") || DEFAULT_TEACHERS;
updateTeacherSelect();
renderLeaves();
renderHolidays();
};

function toggleTeacherBox(){
document.getElementById("teacherBox").classList.toggle("hidden");
}

function saveTeachers(){
localStorage.setItem("teachers", document.getElementById("teacherInput").value);
updateTeacherSelect();
alert("교사명단 저장 완료");
}

function parseTeachers(){
return document.getElementById("teacherInput").value.trim().split("\n").map(line=>{
const [age, room, name] = line.split(",").map(v=>v.trim());
return {
age, room, name,
morningHours:0,
afternoonHours:0,
totalHours:0,
assignedDates:[]
};
});
}

function updateTeacherSelect(){
const teachers = parseTeachers();
const select = document.getElementById("leaveTeacher");
select.innerHTML = "";
teachers.forEach(t=>{
const op = document.createElement("option");
op.value = t.name;
op.textContent = `${t.name} (${t.room})`;
select.appendChild(op);
});
}

function addLeave(){
const date = leaveDate.value;
const teacher = leaveTeacher.value;
if(!date || !teacher) return;
leaves.push({date, teacher});
localStorage.setItem("leaves", JSON.stringify(leaves));
renderLeaves();
}

function removeLeave(i){
leaves.splice(i,1);
localStorage.setItem("leaves", JSON.stringify(leaves));
renderLeaves();
}

function clearLeaves(){
leaves=[];
localStorage.setItem("leaves", JSON.stringify(leaves));
renderLeaves();
}

function renderLeaves(){
let html="<table><tr><th>날짜</th><th>교사</th><th>삭제</th></tr>";
leaves.forEach((l,i)=>{
html += `<tr><td>${l.date}</td><td>${l.teacher}</td><td><button class="red" onclick="removeLeave(${i})">삭제</button></td></tr>`;
});
html+="</table>";
leaveList.innerHTML = html;
}

function addHoliday(){
const date = holidayDate.value;
const reason = holidayReason.value;
if(!date) return;
holidays.push({date, reason});
localStorage.setItem("holidays", JSON.stringify(holidays));
renderHolidays();
}

function removeHoliday(i){
holidays.splice(i,1);
localStorage.setItem("holidays", JSON.stringify(holidays));
renderHolidays();
}

function clearHolidays(){
holidays=[];
localStorage.setItem("holidays", JSON.stringify(holidays));
renderHolidays();
}

function renderHolidays(){
let html="<table><tr><th>날짜</th><th>사유</th><th>삭제</th></tr>";
holidays.forEach((h,i)=>{
html += `<tr><td>${h.date}</td><td>${h.reason||""}</td><td><button class="red" onclick="removeHoliday(${i})">삭제</button></td></tr>`;
});
html+="</table>";
holidayList.innerHTML = html;
}

function getWeekday(date){
return ["일","월","화","수","목","금","토"][date.getDay()];
}

function getMonthDates(monthValue){
const [year, month] = monthValue.split("-").map(Number);
const lastDay = new Date(year, month, 0).getDate();
const dates = [];

for(let d=1; d<=lastDay; d++){
const date = new Date(year, month-1, d);
const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const weekday = getWeekday(date);
const holiday = holidays.find(h=>h.date===dateStr);

if(weekday !== "토" && weekday !== "일"){
dates.push({
dateStr,
day:d,
weekday,
isHoliday: !!holiday,
holidayReason: holiday ? holiday.reason : ""
});
}
}
return dates;
}
  
function chooseTeacher(teachers, slot, dateStr){
const unavailable = leaves.filter(l=>l.date===dateStr).map(l=>l.teacher);

const candidates = teachers.filter(t=>{
if(unavailable.includes(t.name)) return false;
if(t.assignedDates.includes(dateStr)) return false;
return true;
});

if(candidates.length===0) return null;

candidates.sort((a,b)=>a.totalHours - b.totalHours);

return candidates[0];
}

function generateSchedule(){
const monthValue = monthInput.value;
if(!monthValue){alert("월 선택 필요"); return;}

const teachers = parseTeachers();
const dates = getMonthDates(monthValue);
const rows = [];

dates.forEach(day=>{
const row = {
day:day.day,
weekday:day.weekday,
isHoliday:day.isHoliday,
holidayReason:day.holidayReason
};

if(day.isHoliday){
rows.push(row);
return;
}

slots.forEach(slot=>{
const teacher = chooseTeacher(teachers, slot, day.dateStr);

if(teacher){
row[slot.key] = teacher.name;
teacher.totalHours += slot.hours;
if(slot.part==="morning") teacher.morningHours += slot.hours;
if(slot.part==="afternoon") teacher.afternoonHours += slot.hours;
teacher.assignedDates.push(day.dateStr);
}else{
row[slot.key] = "배정불가";
}
});

rows.push(row);
});
  
currentSchedule = rows;
currentStats = teachers;

renderSchedule(rows);
renderStats(teachers);
}

function renderSchedule(rows){
let html = `<table id="scheduleTable">
<tr>
<th rowspan="5">일</th>
<th rowspan="5">요일</th>
<th colspan="16">오전</th>
<th colspan="2">오후</th>
</tr>

<tr>
<th colspan="9">영아</th>
<th colspan="7">유아</th>
<th colspan="2">통합</th>
</tr>

<tr>
<th colspan="5">만1세</th>
<th colspan="4">만2세</th>
<th colspan="3">만3세</th>
<th colspan="2">만4세</th>
<th colspan="2">만5세</th>
<th colspan="2">통합</th>
</tr>

<tr>
<th colspan="2">햇빛</th>
<th colspan="3">달빛</th>
<th colspan="3">봄빛</th>
<th>예빛</th>
<th colspan="3">새빛</th>
<th>꽃빛</th>
<th>윤빛</th>
<th>솔빛</th>
<th>들빛</th>
<th>18:00~19:00</th>
<th>18:00~20:00</th>
</tr>

<tr>
${slots.map(s=>`<th class="slotHead">${s.time}<br>${s.role}</th>`).join("")}
</tr>`;

let prevWeekGroup = "";

rows.forEach(r=>{
const weekGroup = Math.ceil(r.day / 7);

if(prevWeekGroup !== "" && prevWeekGroup !== weekGroup){
html += `<tr class="weekGap"><td colspan="20"></td></tr>`;
}

prevWeekGroup = weekGroup;

if(r.isHoliday){
html += `<tr class="holidayRow">
<td>${r.day}</td>
<td>${r.weekday}</td>
<td colspan="18">${r.holidayReason || "공휴일/제외일"}</td>
</tr>`;
return;
}

html += `<tr>
<td>${r.day}</td>
<td>${r.weekday}</td>
${slots.map(s=>`<td>${r[s.key] || ""}</td>`).join("")}
</tr>`;
});

html += `</table>`;
scheduleResult.innerHTML = html;
}
  function ageOrder(age){
return {"만1세":1,"만2세":2,"만3세":3,"만4세":4,"만5세":5}[age] || 99;
}

function renderStats(teachers){
teachers.sort((a,b)=>{
if(ageOrder(a.age)!==ageOrder(b.age)) return ageOrder(a.age)-ageOrder(b.age);
if(a.room!==b.room) return a.room.localeCompare(b.room,"ko");
return a.name.localeCompare(b.name,"ko");
});

let html = `<table id="statsTable">
<tr>
<th>연령</th>
<th>반</th>
<th>교사</th>
<th>오전 시간</th>
<th>오후 시간</th>
<th>총 시간</th>
</tr>`;

let currentAge = "";

teachers.forEach(t=>{
if(currentAge !== t.age){
currentAge = t.age;
html += `<tr><td colspan="6" class="group">${t.age}</td></tr>`;
}

html += `<tr>
<td>${t.age}</td>
<td>${t.room}</td>
<td>${t.name}</td>
<td>${t.morningHours}</td>
<td>${t.afternoonHours}</td>
<td>${t.totalHours}</td>
</tr>`;
});

html += `</table>`;
statsResult.innerHTML = html;
}

function saveCurrentSchedule(){
const month = monthInput.value;
if(!month || currentSchedule.length===0){alert("먼저 생성 필요"); return;}

const saved = JSON.parse(localStorage.getItem("savedSchedules") || "{}");
saved[month] = {
schedule:currentSchedule,
stats:currentStats
};

localStorage.setItem("savedSchedules", JSON.stringify(saved));
alert("저장 완료");
}

function downloadTableAsExcel(tableId, filename){
const table = document.getElementById(tableId);
const html = `<html><head><meta charset="UTF-8"></head><body>${table.outerHTML}</body></html>`;
const blob = new Blob([html], {type:"application/vnd.ms-excel"});
const link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = filename + ".xls";
link.click();
}

function downloadScheduleExcel(){
downloadTableAsExcel("scheduleTable","당직표");
}

function downloadStatsExcel(){
downloadTableAsExcel("statsTable","교사별통계");
}
</script>

</body>
</html>
